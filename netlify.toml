[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "microphone=(self)"

[[redirects]]
  from = "/api/*"
  to = "https://onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ws/*"
  to = "https://onrender.com/ws/:splat"
  status = 200
  force = true
